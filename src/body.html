<body>
<div id="intro" class="intro" aria-hidden="true">
  <div class="in-stage">
    <span class="in-chip" style="--x:-250px;--y:-150px;--c:#5A2BFF;--d:.62s">PDF</span>
    <span class="in-chip" style="--x:260px;--y:-120px;--c:#E8246A;--d:.78s">JPG</span>
    <span class="in-chip" style="--x:-270px;--y:110px;--c:#00A08A;--d:.94s">P7M</span>
    <span class="in-chip" style="--x:250px;--y:140px;--c:#1F6FE0;--d:1.08s">XML</span>
    <span class="in-chip" style="--x:0px;--y:-230px;--c:#D98A00;--d:1.22s">DOCX</span>
    <svg class="in-logo" viewBox="-4 -4 72 72" width="220" height="220">
      <defs>
        <linearGradient id="inP" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A52FF"/><stop offset="1" stop-color="#4518E6"/></linearGradient>
        <linearGradient id="inO" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF3D7F"/><stop offset=".55" stop-color="#FF7A59"/><stop offset="1" stop-color="#FF3D7F"/></linearGradient>
        <clipPath id="inF"><rect x="-10" y="35" width="84" height="40" transform="rotate(-24 32 35)"/></clipPath>
      </defs>
      <path class="in-orb in-orb-b" pathLength="100" d="M6.42 46.39A28 10.5 -24 0 1 57.58 23.61" fill="none" stroke="url(#inO)" stroke-width="3.6" stroke-linecap="round"/>
      <g class="in-sun-g" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.05s" dur=".3s" fill="freeze"/><circle r="4.6" fill="#FFC234"/><circle r="8" fill="#FFC234" opacity=".25"/><animateMotion begin="1.05s" dur="2.4s" repeatCount="indefinite" path="M6.42 46.39A28 10.5 -24 0 1 57.58 23.61A28 10.5 -24 0 1 6.42 46.39" rotate="0"/></g>
      <g class="in-page"><path d="M21 9H36L47 20V51A4 4 0 0 1 43 55H21A4 4 0 0 1 17 51V13A4 4 0 0 1 21 9Z" fill="url(#inP)"/><path d="M36 9V18A2 2 0 0 0 38 20H47Z" fill="#B8A6FF"/>
        <path class="in-ln" pathLength="100" d="M22 31h18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path class="in-ln l2" pathLength="100" d="M22 37h18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path class="in-ln l3" pathLength="100" d="M22 43h11" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>
      <path class="in-orb in-orb-f" pathLength="100" d="M57.58 23.61A28 10.5 -24 0 1 6.42 46.39" fill="none" stroke="url(#inO)" stroke-width="3.6" stroke-linecap="round"/>
      <g clip-path="url(#inF)"><g class="in-sun-g" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.05s" dur=".3s" fill="freeze"/><circle r="4.6" fill="#FFC234"/><circle r="8" fill="#FFC234" opacity=".25"/><animateMotion begin="1.05s" dur="2.4s" repeatCount="indefinite" path="M6.42 46.39A28 10.5 -24 0 1 57.58 23.61A28 10.5 -24 0 1 6.42 46.39" rotate="0"/></g></g>
    </svg>
  </div>
  <div class="in-word"><span>f</span><span>i</span><span>l</span><span>e</span><b><span>3</span><span>6</span><span>0</span></b></div>
  <p class="in-motto">Ogni lavoro sui tuoi file, in un giro solo.</p>
</div>
<script>(function(){var d=document.getElementById('intro');try{var pa=(JSON.parse(localStorage.getItem('file360-prefs')||'{}').anim)||'';if(pa)document.documentElement.dataset.anim=(pa==='light'?'off':pa);if(pa==='off'||pa==='light'||matchMedia('(prefers-reduced-motion: reduce)').matches||sessionStorage.getItem('f360-intro')||(navigator.webdriver&&!window.__forceIntro)){d.remove();return}sessionStorage.setItem('f360-intro','1')}catch(e){}document.documentElement.classList.add('intro-on')})();</script>
<a class="skip" href="#main">Vai al contenuto</a>
<div class="app">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Apri il menu" title="Menu: azioni rapide, il tuo lavoro, suggerimenti" aria-haspopup="dialog" aria-expanded="false" aria-controls="drawer"></button>
    <button class="brand" id="brand" title="Home · tutti gli strumenti">
      <span class="logo" id="brand-logo"></span>
      <span class="wordmark">file<b>360</b></span>
      <small class="brand-tag">strumenti PDF sul tuo dispositivo</small>
    </button>
    <div class="top-spacer"></div>
    <nav class="top-work" id="top-work" aria-label="Il tuo lavoro" hidden></nav>
    <div class="privacy" title="Tutta l'elaborazione avviene nel tuo browser: i documenti non vengono mai caricati su internet."><span class="ic" id="shield-ic"></span><span>I file restano sul tuo computer</span></div>
    <button class="icon-btn" id="search-btn" title="Cerca uno strumento (Ctrl+K / ⌘K)" aria-label="Cerca uno strumento" aria-haspopup="dialog" aria-expanded="false" aria-controls="cmd-dialog"><span class="ic" id="search-ic"></span></button>
    <button class="icon-btn" id="theme-btn" title="Cambia tema" aria-label="Cambia tema chiaro o scuro" aria-pressed="false"></button>
  </header>
  <div class="body">
    <nav class="rail" id="rail" aria-label="Navigazione degli strumenti"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>
<div class="toasts" id="toasts"></div>
